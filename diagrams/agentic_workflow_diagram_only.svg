<svg width="1100" height="550" viewBox="0 0 1100 550" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>The agentic replenishment loop at Northpeak Outfitters</title>
<desc>A four-stage loop — sense, decide, act, escalate — in which an agent performs the reading and arithmetic in seconds across every product, and holds back anything uncertain or operationally urgent for a planner to approve, edit or reject, with every decision recorded.</desc>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#9AA394" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .h1  { font-family: Georgia, 'Times New Roman', serif; font-size: 27px; font-weight: 700; fill: #24241F; }
    .h2  { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: 700; fill: #2C5F2D; }
    .sub { font-family: Calibri, Arial, sans-serif; font-size: 15px; fill: #6E6E66; }
    .st  { font-family: Calibri, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #24241F; }
    .bd  { font-family: Calibri, Arial, sans-serif; font-size: 13px; fill: #55554E; }
    .bdy { font-family: Calibri, Arial, sans-serif; font-size: 13.5px; fill: #3A3A34; }
    .chip{ font-family: Calibri, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #55554E; letter-spacing: .4px; }
    .chg { font-family: Calibri, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #2C5F2D; letter-spacing: .4px; }
    .gain{ font-family: Calibri, Arial, sans-serif; font-size: 12.5px; fill: #3E7A3F; }
    .num { font-family: Georgia, 'Times New Roman', serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .band{ font-family: Calibri, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #3A3A34; }
    .gt  { font-family: Calibri, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #24541F; }
    .gb  { font-family: Calibri, Arial, sans-serif; font-size: 13px; fill: #35603A; }
    .lbl { font-family: Calibri, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #8A8A80; letter-spacing: 1.6px; }
    .loop{ font-family: Calibri, Arial, sans-serif; font-size: 12.5px; fill: #6E6E66; font-style: italic; }
  </style>
</defs>

<text class="lbl" x="50" y="42">REBUILT STATE</text>
<text class="h1" x="50" y="76">Replenishment rebuilt around an agent</text>
<text class="sub" x="50" y="102">Every product assessed in seconds — and a person kept at the one point where judgement is worth spending.</text>

<g>
  <rect x="50" y="130" width="205" height="150" rx="10" fill="#F1F5EE" stroke="#CFDEC5" stroke-width="1"/>
  <circle cx="76" cy="158" r="14" fill="#2C5F2D"/>
  <text class="num" x="76" y="163" text-anchor="middle">1</text>
  <text class="st" x="100" y="164">Sense</text>
  <text class="bd" x="70" y="196">Read sales by channel, stock</text>
  <text class="bd" x="70" y="214">on hand, orders in transit,</text>
  <text class="bd" x="70" y="232">current supplier lead times.</text>
  <rect x="70" y="248" width="72" height="20" rx="10" fill="#E1EBDA"/>
  <text class="chg" x="106" y="262" text-anchor="middle">SECONDS</text>
</g>
<text class="gain" x="50" y="303">Every product, every run —</text>
<text class="gain" x="50" y="320">not the hundred that fit.</text>

<g>
  <rect x="315" y="130" width="205" height="150" rx="10" fill="#F1F5EE" stroke="#CFDEC5" stroke-width="1"/>
  <circle cx="341" cy="158" r="14" fill="#2C5F2D"/>
  <text class="num" x="341" y="163" text-anchor="middle">2</text>
  <text class="st" x="365" y="164">Decide</text>
  <text class="bd" x="335" y="196">Size the reorder, and score</text>
  <text class="bd" x="335" y="214">how confident it is in the</text>
  <text class="bd" x="335" y="232">number it just produced.</text>
  <rect x="335" y="248" width="72" height="20" rx="10" fill="#E1EBDA"/>
  <text class="chg" x="371" y="262" text-anchor="middle">SECONDS</text>
</g>
<text class="gain" x="315" y="303">Confidence is an output,</text>
<text class="gain" x="315" y="320">not an assumption.</text>

<g>
  <rect x="580" y="130" width="205" height="150" rx="10" fill="#F1F5EE" stroke="#CFDEC5" stroke-width="1"/>
  <circle cx="606" cy="158" r="14" fill="#2C5F2D"/>
  <text class="num" x="606" y="163" text-anchor="middle">3</text>
  <text class="st" x="630" y="164">Act</text>
  <text class="bd" x="600" y="196">Draft the purchase order</text>
  <text class="bd" x="600" y="214">with the reasoning attached</text>
  <text class="bd" x="600" y="232">in plain English.</text>
  <rect x="600" y="248" width="72" height="20" rx="10" fill="#E1EBDA"/>
  <text class="chg" x="636" y="262" text-anchor="middle">SECONDS</text>
</g>
<text class="gain" x="580" y="303">The reasoning outlives</text>
<text class="gain" x="580" y="320">the decision.</text>

<g>
  <rect x="845" y="130" width="205" height="150" rx="10" fill="#EDF3E7" stroke="#97BC62" stroke-width="1.6"/>
  <circle cx="871" cy="158" r="14" fill="#5C8A3C"/>
  <text class="num" x="871" y="163" text-anchor="middle">4</text>
  <text class="st" x="895" y="164">Escalate</text>
  <text class="bd" x="865" y="196">Hold back anything</text>
  <text class="bd" x="865" y="214">uncertain, or about to go</text>
  <text class="bd" x="865" y="232">out of stock, for a person.</text>
  <rect x="865" y="248" width="72" height="20" rx="10" fill="#D8E7C8"/>
  <text class="chg" x="901" y="262" text-anchor="middle">HUMAN</text>
</g>
<text class="gain" x="845" y="303">Nothing uncertain is</text>
<text class="gain" x="845" y="320">committed silently.</text>

<line x1="262" y1="205" x2="306" y2="205" stroke="#9AA394" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="527" y1="205" x2="571" y2="205" stroke="#9AA394" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="792" y1="205" x2="836" y2="205" stroke="#9AA394" stroke-width="1.8" marker-end="url(#ar)"/>

<rect x="50" y="348" width="1000" height="46" rx="8" fill="#EEF1EA"/>
<circle cx="82" cy="371" r="13" fill="#2C5F2D"/>
<circle cx="82" cy="367" r="4.4" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
<path d="M74 380 a8.3 6.6 0 0 1 16 0" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
<text class="band" x="106" y="376">The agent does the reading and the arithmetic. Human judgement is spent on the handful of cases that actually need it.</text>

<rect x="50" y="416" width="1000" height="74" rx="10" fill="#EDF3E7" stroke="#97BC62" stroke-width="1.6"/>
<text class="gt" x="76" y="446">Planner review — this stage is the entire point</text>
<text class="gb" x="76" y="469">Every held recommendation arrives with its reasoning. Approve it, edit the quantity, or reject it with a stated reason — all of it logged.</text>

<text class="loop" x="50" y="512">↻  Overrides are recorded and intended to feed back into the decision thresholds. That loop is designed, but not yet built.</text>

</svg>
