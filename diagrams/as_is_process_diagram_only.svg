<svg width="1100" height="550" viewBox="0 0 1100 550" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>The as-is manual replenishment process at Northpeak Outfitters</title>
<desc>A four-step linear manual process — pull data, analyse, decide, act — performed end to end by a single planner in roughly half a day, with the failure mode of each step annotated, and with no review or audit stage at any point.</desc>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#9AA394" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .h1  { font-family: Georgia, 'Times New Roman', serif; font-size: 27px; font-weight: 700; fill: #24241F; }
    .h2  { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: 700; fill: #2C5F2D; }
    .sub { font-family: Calibri, Arial, sans-serif; font-size: 15px; fill: #6E6E66; }
    .st  { font-family: Calibri, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #24241F; }
    .bd  { font-family: Calibri, Arial, sans-serif; font-size: 13px; fill: #55554E; }
    .bdy { font-family: Calibri, Arial, sans-serif; font-size: 13.5px; fill: #3A3A34; }
    .chip{ font-family: Calibri, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #55554E; letter-spacing: .4px; }
    .fail{ font-family: Calibri, Arial, sans-serif; font-size: 12.5px; fill: #A34430; }
    .num { font-family: Georgia, 'Times New Roman', serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .band{ font-family: Calibri, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #3A3A34; }
    .gt  { font-family: Calibri, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #A34430; }
    .gb  { font-family: Calibri, Arial, sans-serif; font-size: 13px; fill: #A34430; }
    .lbl { font-family: Calibri, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #8A8A80; letter-spacing: 1.6px; }
  </style>
</defs>

<text class="lbl" x="50" y="42">CURRENT STATE</text>
<text class="h1" x="50" y="76">Replenishment as it happens today</text>
<text class="sub" x="50" y="102">One planner, half a day, four manual steps — and no point at which anything is checked.</text>

<g>
  <rect x="50" y="130" width="205" height="150" rx="10" fill="#F5F6F2" stroke="#D9DED3" stroke-width="1"/>
  <circle cx="76" cy="158" r="14" fill="#6E6E66"/>
  <text class="num" x="76" y="163" text-anchor="middle">1</text>
  <text class="st" x="100" y="164">Pull data</text>
  <text class="bd" x="70" y="196">Export last week's sales</text>
  <text class="bd" x="70" y="214">from the ERP by hand into</text>
  <text class="bd" x="70" y="232">a spreadsheet.</text>
  <rect x="70" y="248" width="72" height="20" rx="10" fill="#E7EAE2"/>
  <text class="chip" x="106" y="262" text-anchor="middle">~45 MIN</text>
</g>
<text class="fail" x="50" y="303">No validation — an export</text>
<text class="fail" x="50" y="320">error carries through silently.</text>

<g>
  <rect x="315" y="130" width="205" height="150" rx="10" fill="#F5F6F2" stroke="#D9DED3" stroke-width="1"/>
  <circle cx="341" cy="158" r="14" fill="#6E6E66"/>
  <text class="num" x="341" y="163" text-anchor="middle">2</text>
  <text class="st" x="365" y="164">Analyse</text>
  <text class="bd" x="335" y="196">Scroll and eyeball trends.</text>
  <text class="bd" x="335" y="214">No systematic method and</text>
  <text class="bd" x="335" y="232">no model behind it.</text>
  <rect x="335" y="248" width="72" height="20" rx="10" fill="#E7EAE2"/>
  <text class="chip" x="371" y="262" text-anchor="middle">~2 HRS</text>
</g>
<text class="fail" x="315" y="303">Reaches perhaps 100 of</text>
<text class="fail" x="315" y="320">several thousand products.</text>

<g>
  <rect x="580" y="130" width="205" height="150" rx="10" fill="#F5F6F2" stroke="#D9DED3" stroke-width="1"/>
  <circle cx="606" cy="158" r="14" fill="#6E6E66"/>
  <text class="num" x="606" y="163" text-anchor="middle">3</text>
  <text class="st" x="630" y="164">Decide</text>
  <text class="bd" x="600" y="196">Set reorder quantities from</text>
  <text class="bd" x="600" y="214">experience and instinct,</text>
  <text class="bd" x="600" y="232">product by product.</text>
  <rect x="600" y="248" width="72" height="20" rx="10" fill="#E7EAE2"/>
  <text class="chip" x="636" y="262" text-anchor="middle">~1 HR</text>
</g>
<text class="fail" x="580" y="303">The reasoning never leaves</text>
<text class="fail" x="580" y="320">the planner's head.</text>

<g>
  <rect x="845" y="130" width="205" height="150" rx="10" fill="#FAF0ED" stroke="#E3C9C2" stroke-width="1"/>
  <circle cx="871" cy="158" r="14" fill="#A34430"/>
  <text class="num" x="871" y="163" text-anchor="middle">4</text>
  <text class="st" x="895" y="164">Act</text>
  <text class="bd" x="865" y="196">Key each purchase</text>
  <text class="bd" x="865" y="214">suggestion back into the</text>
  <text class="bd" x="865" y="232">ERP, one at a time.</text>
  <rect x="865" y="248" width="72" height="20" rx="10" fill="#F0DCD6"/>
  <text class="chip" x="901" y="262" text-anchor="middle">~45 MIN</text>
</g>
<text class="fail" x="845" y="303">Committed immediately.</text>
<text class="fail" x="845" y="320">Nothing is logged.</text>

<line x1="262" y1="205" x2="306" y2="205" stroke="#9AA394" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="527" y1="205" x2="571" y2="205" stroke="#9AA394" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="792" y1="205" x2="836" y2="205" stroke="#9AA394" stroke-width="1.8" marker-end="url(#ar)"/>

<rect x="50" y="348" width="1000" height="46" rx="8" fill="#EEF1EA"/>
<circle cx="82" cy="371" r="13" fill="#6E6E66"/>
<circle cx="82" cy="367" r="4.4" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
<path d="M74 380 a8.3 6.6 0 0 1 16 0" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
<text class="band" x="106" y="376">The same person performs all four steps — no handoff, no second pair of eyes, no checkpoint at any stage.</text>

<rect x="50" y="416" width="1000" height="74" rx="10" fill="#FDF7F5" stroke="#E3C9C2" stroke-width="1.6" stroke-dasharray="7 5"/>
<text class="gt" x="76" y="446">Review and audit — this stage does not exist</text>
<text class="gb" x="76" y="469">Nothing verifies the quantities before they are committed, and no record of the reasoning survives the moment they are entered.</text>

</svg>
