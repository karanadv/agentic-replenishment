<svg width="800" height="300" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>Agentic replenishment workflow</title>
<desc>A four-stage pipeline: sense, decide, act, escalate, feeding into a planner review stage that closes the loop back to the agent.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g>
<rect x="50" y="40" width="130" height="56" rx="8" stroke-width="1" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="115" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Sense</text>
<text x="115" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Pull sales &amp; inventory data</text>
</g>

<g>
<rect x="200" y="40" width="130" height="56" rx="8" stroke-width="1" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="265" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Decide</text>
<text x="265" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Score recommendation + confidence</text>
</g>

<g>
<rect x="350" y="40" width="130" height="56" rx="8" stroke-width="1" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="415" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Act</text>
<text x="415" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Draft PO, attach reasoning</text>
</g>

<g>
<rect x="500" y="40" width="130" height="56" rx="8" stroke-width="1" fill="#FAECE7" stroke="#993C1D"/>
<text x="565" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Escalate</text>
<text x="565" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Flag low-confidence / urgent cases</text>
</g>

<line x1="180" y1="68" x2="196" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="330" y1="68" x2="346" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="480" y1="68" x2="496" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<path d="M565 96 L565 130 L340 130 L340 156" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="210" y="156" width="260" height="56" rx="8" stroke-width="1" fill="#EEEDFE" stroke="#534AB7"/>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Planner review</text>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Approve, edit, or reject</text>
</g>

<text x="340" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">↻ Overrides feed back into decision rules for future runs</text>
</svg>
